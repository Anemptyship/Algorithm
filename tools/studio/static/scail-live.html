<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생성 중인 구간 보기</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#171922; --panel2:#1f2230; --line:#2b2f3f; --text:#e8eaf0;
    --muted:#9aa0b4; --accent:#6c8cff; --accent2:#4a6bff; --good:#37d67a; --warn:#ffb020; --bad:#ff5c5c;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f5f8; --panel:#ffffff; --panel2:#f0f2f7; --line:#e1e4ec; --text:#1a1d26; --muted:#5c6378;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
  h1{font-size:19px;margin:4px 0 2px;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .sub a{color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  #playerCard{display:none}
  #playerCard.show{display:block}
  .pl{display:flex;gap:14px;flex-wrap:wrap}
  video{width:230px;max-width:100%;aspect-ratio:9/16;background:#000;border-radius:12px;display:block}
  .plmeta{flex:1;min-width:200px}
  .plmeta b{font-size:14px}
  .note{font-size:12px;color:var(--muted)}
  .job{display:flex;gap:12px}
  .job.focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .job img{width:54px;height:96px;object-fit:cover;border-radius:8px;background:#000;flex:none}
  .body{min-width:0;flex:1}
  .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .top b{font-size:13px;word-break:break-all}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);background:var(--panel2)}
  .chip.running{border-color:var(--good);color:var(--good)}
  .chip.queued{border-color:var(--accent);color:var(--accent)}
  .chip.cancelled,.chip.error{border-color:var(--warn);color:var(--warn)}
  .segs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .seg{font:inherit;font-size:12px;min-width:64px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;text-align:center}
  .seg small{display:block;color:var(--muted);font-size:10px}
  .seg.done{border-color:var(--good)}
  .seg.cur{border-color:var(--accent);cursor:default;background:linear-gradient(90deg,rgba(108,140,255,.28) var(--p,0%),var(--panel2) var(--p,0%))}
  .seg.pend{opacity:.5;cursor:default}
  .seg.on{outline:2px solid var(--accent)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
  button.btn{font:inherit;font-size:13px;border-radius:9px;padding:8px 13px;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;border:0;font-weight:600}
  button.btn.stop{border-color:var(--bad);color:var(--bad)}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  .empty{color:var(--muted);text-align:center;padding:36px 10px;font-size:14px}
  .err{color:var(--bad);font-size:12px;margin-top:4px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;max-width:90vw;z-index:9}
  .toast.show{opacity:1}.toast.bad{border-color:var(--bad)}.toast.good{border-color:var(--good)}
  @media (max-width:560px){.job img{width:44px;height:78px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>생성 중인 구간 보기</h1>
  <div class="sub">구간이 하나 끝날 때마다 바로 볼 수 있어요. 마음에 안 들면 중단하고, 괜찮으면 그대로 두세요. 끝난 구간은 중단해도 보존되고, <b>이어서 생성</b>하면 나머지만 만들어요. · <a href="/scail-repair">구간 수정</a></div>

  <div class="card" id="playerCard">
    <div class="pl">
      <video id="player" controls playsinline preload="metadata"></video>
      <div class="plmeta">
        <b id="plTitle"></b>
        <div class="note" id="plWhat"></div>
        <div class="row"><button class="btn" id="plClose" type="button">닫기</button></div>
      </div>
    </div>
  </div>

  <div id="jobs"><div class="empty">불러오는 중…</div></div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/scail-live.js"></script>
</body>
</html>
