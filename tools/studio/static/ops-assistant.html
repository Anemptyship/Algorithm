<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemma 정비 도우미</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#171922; --panel2:#1f2230; --line:#2b2f3f; --text:#e8eaf0;
    --muted:#9aa0b4; --accent:#6c8cff; --accent2:#4a6bff; --good:#37d67a; --warn:#ffb020; --bad:#ff5c5c;
    --add:rgba(55,214,122,.16); --del:rgba(255,92,92,.16);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f5f8; --panel:#ffffff; --panel2:#f0f2f7; --line:#e1e4ec; --text:#1a1d26; --muted:#5c6378;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 70px}
  h1{font-size:19px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card.focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  label.fld{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font:inherit}
  textarea{min-height:84px;resize:vertical}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  button.btn{font:inherit;font-size:14px;border-radius:9px;padding:9px 14px;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;border:0;font-weight:600}
  button.btn.danger{border-color:var(--bad);color:var(--bad)}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px}
  .chk input{margin-top:3px}
  .hint{color:var(--muted);font-size:12px}
  .note{color:var(--muted);font-size:12px}
  .banner{border:1px solid var(--warn);background:rgba(255,176,32,.08);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px}
  .banner.ok{border-color:var(--good);background:rgba(55,214,122,.08)}
  .banner.bad{border-color:var(--bad);background:rgba(255,92,92,.08)}
  .top{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
  .top b{font-size:14px;word-break:break-word}
  .chip{font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);background:var(--panel2)}
  .chip.queued,.chip.running{border-color:var(--accent);color:var(--accent)}
  .chip.answered,.chip.applied{border-color:var(--good);color:var(--good)}
  .chip.proposed{border-color:var(--warn);color:var(--warn)}
  .chip.failed,.chip.invalid,.chip.stale,.chip.rolled_back{border-color:var(--bad);color:var(--bad)}
  .reply{white-space:pre-wrap;word-break:break-word;margin:10px 0 0;font-size:14px}
  .checks{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
  .checks li.ok::before{content:"✓ ";color:var(--good)}
  .checks li.no::before{content:"✗ ";color:var(--bad)}
  .flag{color:var(--warn);font-size:13px;margin-top:6px}
  .err{color:var(--bad);font-size:13px;margin-top:8px}
  pre.diff{margin:10px 0 0;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:420px}
  pre.diff span{display:block;padding:0 12px;white-space:pre}
  pre.diff .a{background:var(--add)} pre.diff .d{background:var(--del)} pre.diff .h{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;max-width:90vw;z-index:9}
  .toast.show{opacity:1}.toast.bad{border-color:var(--bad)}.toast.good{border-color:var(--good)}
  details.more{margin-top:10px}
  details.more summary{cursor:pointer;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gemma 정비 도우미</h1>
  <div class="sub">외부 AI는 쓰지 않아요. 이 PC의 Gemma가 파일과 오류 로그를 읽고 답하거나 <b>수정안</b>을 만들어요. 수정안은 <b>직접 확인하고 눌러야만</b> 적용되고, 언제든 되돌릴 수 있어요.</div>

  <div id="banner"></div>

  <div class="card">
    <label class="fld" for="prompt">무엇이 궁금하거나, 무엇을 고칠까요?</label>
    <textarea id="prompt" maxlength="1500" placeholder="예) 구간 수정 화면에서 완료 안내 문구를 '수정본이 만들어졌어요'로 바꿔줘&#10;예) 유튜브 업로드가 왜 실패했는지 알려줘"></textarea>
    <label class="fld" for="target">어느 파일을 볼까요? <span class="hint" id="suggested"></span></label>
    <select id="target"></select>
    <div class="chk"><input type="checkbox" id="logs" checked><div><label for="logs">최근 서버 오류 로그도 함께 보기</label><div class="hint">비밀번호·토큰처럼 보이는 값은 가려서 보내요.</div></div></div>
    <details class="more"><summary>고급</summary>
      <div class="chk"><input type="checkbox" id="preempt"><div><label for="preempt">지금 돌고 있는 영상 생성을 멈추고 먼저 처리</label><div class="hint">GPU가 하나라서 보통은 영상 생성이 끝난 뒤에 답해요. 멈춘 작업은 끝난 구간을 보존한 채 나중에 이어서 해요.</div></div></div>
    </details>
    <div class="row">
      <button class="btn" id="ask" type="button">💬 물어보기</button>
      <button class="btn primary" id="fix" type="button">🔧 수정안 만들기</button>
      <span class="note" id="sendNote"></span>
    </div>
  </div>

  <div id="list"><div class="empty">불러오는 중…</div></div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/ops-assistant.js"></script>
</body>
</html>
